---
- name: Install kiosk launch script
  ansible.builtin.template:
    src: kiosk-launch.sh.j2
    dest: /usr/local/bin/kiosk-launch.sh
    owner: root
    group: root
    mode: "0755"
  notify: Restart kiosk

- name: Install kiosk systemd unit
  ansible.builtin.template:
    src: kiosk.service.j2
    dest: /etc/systemd/system/kiosk.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart kiosk

- name: Install update-kiosk helper (git pull + re-apply)
  ansible.builtin.template:
    src: update-kiosk.j2
    dest: /usr/local/bin/update-kiosk
    owner: root
    group: root
    mode: "0755"

# Optional scheduled auto-pull, shipped DISABLED. Enable manually if you ever
# want hands-off updates: `sudo systemctl enable --now kiosk-update.timer`
- name: Install (disabled) auto-update service + timer
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - kiosk-update.service
    - kiosk-update.timer
  notify: Reload systemd

- name: Boot to console (no graphical target needed)
  ansible.builtin.file:
    src: /lib/systemd/system/multi-user.target
    dest: /etc/systemd/system/default.target
    state: link
    force: true

# Escape hatch: keep a real getty permanently running on a dedicated VT so
# Ctrl+Alt+F{{ admin_console_tty }} always lands on a login prompt. We can't
# rely on logind's on-demand autovt here — when the active session is the cage
# (wlroots) compositor, switching VTs often doesn't spawn a getty, so the target
# tty is blank and the hotkey appears to "do nothing".
- name: Keep an admin console running on tty{{ admin_console_tty }}
  ansible.builtin.systemd:
    name: "getty@tty{{ admin_console_tty }}.service"
    enabled: true
    state: started

# The cage (wlroots) compositor doesn't forward Ctrl+Alt+F<n> to switch VTs,
# but `chvt` works fine. triggerhappy reads raw evdev key events (independent of
# the compositor) and runs the switch directly — a robust escape hatch.
- name: Install triggerhappy (evdev hotkey daemon)
  ansible.builtin.apt:
    name: triggerhappy
    state: present

- name: Allow triggerhappy (runs as 'nobody') to switch VTs
  ansible.builtin.copy:
    dest: /etc/sudoers.d/kiosk-chvt
    owner: root
    group: root
    mode: "0440"
    validate: "visudo -cf %s"
    content: |
      # Kiosk console escape hatch: let the triggerhappy daemon switch VTs.
      nobody ALL=(root) NOPASSWD: /usr/bin/chvt

- name: Install console-switch hotkey bindings
  ansible.builtin.template:
    src: triggerhappy-kiosk.conf.j2
    dest: /etc/triggerhappy/triggers.d/kiosk-console.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart triggerhappy

- name: Enable and start triggerhappy
  ansible.builtin.systemd:
    name: triggerhappy.service
    enabled: true
    state: started

- name: Flush handlers before enabling the service
  ansible.builtin.meta: flush_handlers

- name: Enable and start kiosk
  ansible.builtin.systemd:
    name: kiosk.service
    enabled: "{{ kiosk_start_compositor }}"
    state: "{{ 'started' if kiosk_start_compositor else 'stopped' }}"
