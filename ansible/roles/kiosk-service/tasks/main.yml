---
- name: Create labwc config directory
  ansible.builtin.file:
    path: /etc/kiosk/labwc
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install labwc config (keybindings + window rules)
  ansible.builtin.template:
    src: labwc-rc.xml.j2
    dest: /etc/kiosk/labwc/rc.xml
    owner: root
    group: root
    mode: "0644"
  notify: Restart kiosk

- name: Install labwc autostart (launches the kiosk app)
  ansible.builtin.template:
    src: labwc-autostart.j2
    dest: /etc/kiosk/labwc/autostart
    owner: root
    group: root
    mode: "0755"
  notify: Restart kiosk

- name: Install kiosk app launcher (relaunch loop for crash recovery)
  ansible.builtin.template:
    src: kiosk-app.sh.j2
    dest: /usr/local/bin/kiosk-app.sh
    owner: root
    group: root
    mode: "0755"
  notify: Restart kiosk

- name: Install kiosk launch script (starts labwc)
  ansible.builtin.template:
    src: kiosk-launch.sh.j2
    dest: /usr/local/bin/kiosk-launch.sh
    owner: root
    group: root
    mode: "0755"
  notify: Restart kiosk

- name: Allow the kiosk user to switch VTs (console escape hatch)
  ansible.builtin.copy:
    dest: /etc/sudoers.d/kiosk-chvt
    owner: root
    group: root
    mode: "0440"
    validate: "visudo -cf %s"
    content: |
      # The labwc escape-hatch keybinding runs this to drop to the console.
      {{ kiosk_user }} ALL=(root) NOPASSWD: /usr/bin/chvt

- name: Install kiosk systemd unit
  ansible.builtin.template:
    src: kiosk.service.j2
    dest: /etc/systemd/system/kiosk.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart kiosk

- name: Install update-kiosk helper (git pull + re-apply)
  ansible.builtin.template:
    src: update-kiosk.j2
    dest: /usr/local/bin/update-kiosk
    owner: root
    group: root
    mode: "0755"

# Optional scheduled auto-pull, shipped DISABLED. Enable manually if you ever
# want hands-off updates: `sudo systemctl enable --now kiosk-update.timer`
- name: Install (disabled) auto-update service + timer
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - kiosk-update.service
    - kiosk-update.timer
  notify: Reload systemd

- name: Boot to console (no graphical target needed)
  ansible.builtin.file:
    src: /lib/systemd/system/multi-user.target
    dest: /etc/systemd/system/default.target
    state: link
    force: true

# The console the escape hatch drops to. Keep a getty permanently running here
# (logind's on-demand autovt is unreliable under a wlroots session).
- name: Keep an admin console running on tty{{ admin_console_tty }}
  ansible.builtin.systemd:
    name: "getty@tty{{ admin_console_tty }}.service"
    enabled: true
    state: started

# Clean up the previous (cage-era) triggerhappy escape-hatch attempt, which
# can't work because the compositor takes the keyboard exclusively.
- name: Remove stale triggerhappy hotkey config
  ansible.builtin.file:
    path: /etc/triggerhappy/triggers.d/kiosk-console.conf
    state: absent

- name: Flush handlers before enabling the service
  ansible.builtin.meta: flush_handlers

- name: Enable and start kiosk
  ansible.builtin.systemd:
    name: kiosk.service
    enabled: "{{ kiosk_start_compositor }}"
    state: "{{ 'started' if kiosk_start_compositor else 'stopped' }}"
