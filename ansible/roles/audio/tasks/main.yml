---
# Pi OS Lite ships no audio server, so Chromium has nothing to route sound to.
# Install PipeWire + the PulseAudio compatibility layer (which is what Chromium
# talks to) + WirePlumber as the session manager. The kiosk user's PAM/login
# session (PAMName=login) auto-starts the user-level PipeWire on next start.
- name: Install PipeWire audio stack
  ansible.builtin.apt:
    name:
      - pipewire           # core audio server
      - pipewire-pulse     # PulseAudio API shim — what Chromium uses
      - wireplumber        # PipeWire session manager (sink/source policy)
      - pipewire-alsa      # ALSA → PipeWire bridge for ALSA clients
      - alsa-utils         # aplay / speaker-test for diagnostics
      - pulseaudio-utils   # pactl / pacmd — used by the setup script below
    state: present

# These ship as user services; enable them for every user (the kiosk user
# included) so they auto-start whenever a session opens.
- name: Enable PipeWire user services globally
  ansible.builtin.command: "systemctl --global enable {{ item }}"
  loop:
    - pipewire.socket
    - pipewire-pulse.socket
    - wireplumber.service
  changed_when: false

# At boot, the kiosk's PipeWire starts before HDMI EDID is detected, so the
# HDMI card profile defaults to "off" and the analog jack is picked. This
# script (run as a user-session oneshot) waits a few seconds, forces HDMI
# stereo on whichever HDMI port has the cable, makes it the default sink,
# and maxes the volume. Works on either HDMI 0 or HDMI 1 — whichever is live.
- name: Install kiosk audio setup script
  ansible.builtin.copy:
    dest: /usr/local/bin/kiosk-audio-setup.sh
    owner: root
    group: root
    mode: "0755"
    content: |
      #!/bin/sh
      # Configure HDMI as the default sink for the current user.
      set -e
      export XDG_RUNTIME_DIR="/run/user/$(id -u)"

      # Wait for PipeWire + HDMI detection to settle.
      sleep 6

      # Force HDMI stereo on whichever HDMI card accepts it (the connected one).
      for card in $(pactl list short cards | awk '/hdmi/{print $2}'); do
        pactl set-card-profile "$card" output:hdmi-stereo 2>/dev/null || true
      done

      # Make the first HDMI sink the default. Volume defaults low (5%) so a
      # freshly-booted device is never loud; the phone remote slider adjusts it.
      hdmi_sink=$(pactl list short sinks | awk '/hdmi/{print $2; exit}')
      if [ -n "$hdmi_sink" ]; then
        pactl set-default-sink "$hdmi_sink" || true
        wpctl set-volume @DEFAULT_AUDIO_SINK@ 0.05 || true
      fi

- name: Install kiosk audio setup user service
  ansible.builtin.copy:
    dest: /etc/systemd/user/kiosk-audio-setup.service
    owner: root
    group: root
    mode: "0644"
    content: |
      [Unit]
      Description=Configure HDMI audio output for the kiosk
      After=wireplumber.service pipewire.service

      [Service]
      Type=oneshot
      ExecStart=/usr/local/bin/kiosk-audio-setup.sh

      [Install]
      WantedBy=default.target

- name: Enable kiosk audio setup user service globally
  ansible.builtin.command: "systemctl --global enable kiosk-audio-setup.service"
  changed_when: false

# Volume-control wrapper: runs as root (via sudo) and switches to the kiosk
# user with the right XDG_RUNTIME_DIR so wpctl can talk to its PipeWire. The
# backend (which runs as the unprivileged 'pitv' user) calls this via sudo.
- name: Install kiosk volume wrapper
  ansible.builtin.copy:
    dest: /usr/local/bin/kiosk-volume
    owner: root
    group: root
    mode: "0755"
    content: |
      #!/bin/sh
      # Get or set the kiosk user's default sink volume.
      #   kiosk-volume          -> print current level (0..1)
      #   kiosk-volume get      -> same
      #   kiosk-volume <0..1>   -> set to that level
      set -e
      uid=$(id -u kiosk)
      runtime="/run/user/$uid"
      arg="${1:-get}"
      case "$arg" in
        get|GET)
          sudo -u kiosk env XDG_RUNTIME_DIR="$runtime" /usr/bin/wpctl get-volume @DEFAULT_AUDIO_SINK@ \
            | awk '{print $2}'
          ;;
        0|1|1.0|0.[0-9]|0.[0-9][0-9])
          sudo -u kiosk env XDG_RUNTIME_DIR="$runtime" /usr/bin/wpctl set-volume @DEFAULT_AUDIO_SINK@ "$arg"
          ;;
        *)
          echo "usage: kiosk-volume [get | <0..1>]" >&2
          exit 2
          ;;
      esac

- name: Allow the backend to call the volume wrapper without a password
  ansible.builtin.copy:
    dest: /etc/sudoers.d/kiosk-volume
    owner: root
    group: root
    mode: "0440"
    validate: "visudo -cf %s"
    content: |
      # The backend (pitv) controls system volume through this wrapper only.
      {{ backend_user }} ALL=(root) NOPASSWD: /usr/local/bin/kiosk-volume
