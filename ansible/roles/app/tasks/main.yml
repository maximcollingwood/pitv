---
# Placeholder app: serve a static "hello world" page from nginx so the whole
# kiosk pipeline (boot → compositor → Chromium → page) can be confirmed before
# a real app exists. Disable by setting kiosk_serve_local_app: false.
- name: Install nginx
  ansible.builtin.apt:
    name: nginx
    state: present

- name: Deploy placeholder page
  ansible.builtin.template:
    src: index.html.j2
    dest: /var/www/html/index.html
    owner: root
    group: root
    mode: "0644"

- name: Ensure nginx is enabled and running
  ansible.builtin.systemd:
    name: nginx
    enabled: true
    state: started
