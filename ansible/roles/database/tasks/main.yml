---
- name: Check whether backend service user exists
  ansible.builtin.command: "id {{ backend_user }}"
  register: backend_user_check
  changed_when: false
  failed_when: false

- name: Create backend service user
  ansible.builtin.user:
    name: "{{ backend_user }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false
  when: backend_user_check.rc != 0

- name: Install database tools
  ansible.builtin.apt:
    name: sqlite3
    state: present

- name: Ensure persistent data directory exists
  ansible.builtin.file:
    path: "{{ db_dir }}"
    state: directory
    owner: "{{ backend_user }}"
    group: "{{ backend_user }}"
    mode: "0755"

# SQLite's online backup includes committed WAL data. Never reset content on deploy.
- name: Check for existing content database
  ansible.builtin.stat:
    path: "{{ db_path }}"
  register: existing_db

- name: Preserve pre-native content backup once
  ansible.builtin.command:
    argv:
      - sqlite3
      - "{{ db_path }}"
      - ".backup '{{ db_dir }}/pre-native-rewrite.db'"
    creates: "{{ db_dir }}/pre-native-rewrite.db"
  when: existing_db.stat.exists

- name: Ensure existing database ownership
  ansible.builtin.file:
    path: "{{ db_path }}"
    owner: "{{ backend_user }}"
    group: "{{ backend_user }}"
    mode: "0644"
  when: existing_db.stat.exists

# Shared backend migration code initializes/upgrades the DB after source deployment.
