---
- name: Create backend service user
  ansible.builtin.user:
    name: "{{ backend_user }}"
    system: true
    shell: /usr/sbin/nologin
    home: "{{ backend_root }}"
    create_home: false
    state: present

- name: Install sqlite3 CLI
  ansible.builtin.apt:
    name: sqlite3
    state: present

- name: Ensure data directory exists
  ansible.builtin.file:
    path: "{{ db_dir }}"
    state: directory
    owner: "{{ backend_user }}"
    group: "{{ backend_user }}"
    mode: "0755"

# schema.sql is idempotent (CREATE TABLE IF NOT EXISTS); seed.sql is idempotent
# (INSERT OR IGNORE), so applying on every run is safe.
- name: Apply schema
  ansible.builtin.shell:
    cmd: "sqlite3 '{{ db_path }}' < '{{ playbook_dir }}/../db/schema.sql'"
  changed_when: false

- name: Apply seed data
  ansible.builtin.shell:
    cmd: "sqlite3 '{{ db_path }}' < '{{ playbook_dir }}/../db/seed.sql'"
  changed_when: false

- name: Ensure database file is owned by the backend user
  ansible.builtin.file:
    path: "{{ db_path }}"
    owner: "{{ backend_user }}"
    group: "{{ backend_user }}"
    mode: "0644"
