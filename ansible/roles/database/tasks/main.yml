---
# Create only when absent. Modifying an existing user in place fails when the
# backend service is already running as it (usermod: "user is currently used by
# process N"), so we never reconcile attributes of an existing account.
- name: Check whether backend service user exists
  ansible.builtin.command: "id {{ backend_user }}"
  register: backend_user_check
  changed_when: false
  failed_when: false

- name: Create backend service user
  ansible.builtin.user:
    name: "{{ backend_user }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false
  when: backend_user_check.rc != 0

- name: Install sqlite3 CLI
  ansible.builtin.apt:
    name: sqlite3
    state: present

- name: Ensure data directory exists
  ansible.builtin.file:
    path: "{{ db_dir }}"
    state: directory
    owner: "{{ backend_user }}"
    group: "{{ backend_user }}"
    mode: "0755"

# One-time reset when the schema version is bumped (PRAGMA user_version). This
# is how the breaking "sections" model rolls out without wiping on every deploy.
- name: Read current DB schema version
  ansible.builtin.command: "sqlite3 '{{ db_path }}' 'PRAGMA user_version;'"
  register: db_user_version
  changed_when: false

- name: Reset app tables when schema is outdated
  ansible.builtin.shell:
    cmd: "sqlite3 '{{ db_path }}' < '{{ playbook_dir }}/../db/reset.sql'"
  when: (db_user_version.stdout | trim | int) < db_schema_version

# schema.sql is idempotent (CREATE TABLE IF NOT EXISTS); seed.sql is idempotent
# (INSERT OR IGNORE), so applying on every run is safe.
- name: Apply schema
  ansible.builtin.shell:
    cmd: "sqlite3 '{{ db_path }}' < '{{ playbook_dir }}/../db/schema.sql'"
  changed_when: false

- name: Apply seed data
  ansible.builtin.shell:
    cmd: "sqlite3 '{{ db_path }}' < '{{ playbook_dir }}/../db/seed.sql'"
  changed_when: false

- name: Record schema version
  ansible.builtin.command: "sqlite3 '{{ db_path }}' 'PRAGMA user_version = {{ db_schema_version }};'"
  changed_when: false

# Additive migrations — applied if the column doesn't exist yet, so existing
# DBs catch up without a destructive reset.
- name: Inspect articles columns
  ansible.builtin.command: "sqlite3 '{{ db_path }}' \"PRAGMA table_info(articles)\""
  register: articles_cols
  changed_when: false

- name: Add articles.position (and seed initial order by title)
  ansible.builtin.shell: |
    set -e
    sqlite3 '{{ db_path }}' "ALTER TABLE articles ADD COLUMN position INTEGER NOT NULL DEFAULT 0;"
    sqlite3 '{{ db_path }}' "UPDATE articles SET position = (SELECT COUNT(*) FROM articles a2 WHERE a2.section_id = articles.section_id AND a2.title <= articles.title);"
  when: "'position' not in articles_cols.stdout"

- name: Ensure database file is owned by the backend user
  ansible.builtin.file:
    path: "{{ db_path }}"
    owner: "{{ backend_user }}"
    group: "{{ backend_user }}"
    mode: "0644"
