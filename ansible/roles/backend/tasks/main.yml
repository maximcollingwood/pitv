---
- name: Ensure backend directory exists
  ansible.builtin.file:
    path: "{{ backend_root }}"
    state: directory
    owner: "{{ backend_user }}"
    group: "{{ backend_user }}"
    mode: "0755"

- name: Ensure /etc/kiosk exists
  ansible.builtin.file:
    path: /etc/kiosk
    state: directory
    owner: root
    group: root
    mode: "0755"

# The admin PIN lives only on the device (never in git, since the repo is
# public). Created once with a default; change it in /etc/kiosk/admin.env and
# `sudo systemctl restart pitv-backend`. force:false keeps your value on re-runs.
- name: Create admin PIN env file (if absent)
  ansible.builtin.copy:
    dest: /etc/kiosk/admin.env
    content: "ADMIN_PIN=0000\n"
    owner: root
    group: root
    mode: "0600"
    force: false
  notify: Restart backend

# Optional device-local overrides; ordinary use only requires pasting a link.
- name: Create media overrides env file (if absent)
  ansible.builtin.copy:
    dest: /etc/kiosk/media.env
    content: "# Optional media worker environment overrides.\n"
    owner: root
    group: root
    mode: "0600"
    force: false
  notify: Restart backend

- name: Deploy backend source
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../server/{{ item }}"
    dest: "{{ backend_root }}/{{ item }}"
    owner: "{{ backend_user }}"
    group: "{{ backend_user }}"
    mode: preserve
  loop: [src/, package.json, tsconfig.json]
  notify: Restart backend

- name: Deploy locked npm workspace manifest
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../{{ item }}"
    dest: "{{ workspace_root }}/{{ item }}"
    owner: "{{ backend_user }}"
    group: "{{ backend_user }}"
    mode: "0644"
  loop: [package.json, package-lock.json]
  notify: Restart backend

- name: Ensure companion workspace directory exists
  ansible.builtin.file:
    path: "{{ app_root }}"
    state: directory
    mode: "0755"

- name: Deploy companion package manifest before workspace install
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../app/package.json"
    dest: "{{ app_root }}/package.json"
    mode: "0644"

- name: Install locked application workspace dependencies
  ansible.builtin.command:
    cmd: /usr/bin/npm ci --no-audit --no-fund
    chdir: "{{ workspace_root }}"
  changed_when: false

- name: Build backend
  ansible.builtin.command:
    cmd: /usr/bin/npm run build
    chdir: "{{ backend_root }}"
  changed_when: false
  notify: Restart backend

# The admin page's System tab shows which commit is running and whether the
# branch has moved on (it compares against `git ls-remote`).
- name: Read the deployed revision
  ansible.builtin.command:
    argv: [git, -c, safe.directory=*, -C, "{{ playbook_dir }}/..", log, -1, "--format=%H%n%cI%n%s"]
  register: deployed_revision
  changed_when: false
  failed_when: false

- name: Record the deployed revision
  ansible.builtin.copy:
    dest: "{{ backend_root }}/version.json"
    owner: "{{ backend_user }}"
    group: "{{ backend_user }}"
    mode: "0644"
    content: "{{ {'commit': revision[0] | default(''), 'date': revision[1] | default(''), 'subject': revision[2] | default(''), 'repo': kiosk_repo_url, 'branch': kiosk_repo_branch, 'selfUpdate': kiosk_self_update} | to_nice_json }}\n"
  vars:
    revision: "{{ deployed_revision.stdout_lines | default([]) if deployed_revision.rc | default(1) == 0 else [] }}"

- name: Fix backend ownership after install/build
  ansible.builtin.file:
    path: "{{ backend_root }}"
    state: directory
    owner: "{{ backend_user }}"
    group: "{{ backend_user }}"
    recurse: true

- name: Deploy database schema and seed alongside backend
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../db/"
    dest: "{{ backend_root }}/db/"
    owner: "{{ backend_user }}"
    group: "{{ backend_user }}"
    mode: preserve
  notify: Restart backend

- name: Initialize or migrate content without resetting it
  ansible.builtin.command:
    cmd: /usr/bin/node dist/init-db.js
    chdir: "{{ backend_root }}"
  environment:
    DB_PATH: "{{ db_path }}"
    DB_SCHEMA_DIR: "{{ backend_root }}/db"
  become_user: "{{ backend_user }}"
  changed_when: false

- name: Install backend systemd unit
  ansible.builtin.template:
    src: pitv-backend.service.j2
    dest: /etc/systemd/system/pitv-backend.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart backend

- name: Flush handlers before enabling the service
  ansible.builtin.meta: flush_handlers

- name: Enable and start backend
  ansible.builtin.systemd:
    name: pitv-backend.service
    enabled: true
    state: started

- name: Verify the native backend is ready
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ backend_port }}/api/health"
    timeout: 3
  register: backend_health
  until: backend_health.status == 200 and backend_health.json.player | default('') == 'native'
  retries: 15
  delay: 1
