---
- name: Ensure backend directory exists
  ansible.builtin.file:
    path: "{{ backend_root }}"
    state: directory
    owner: "{{ backend_user }}"
    group: "{{ backend_user }}"
    mode: "0755"

- name: Ensure /etc/kiosk exists
  ansible.builtin.file:
    path: /etc/kiosk
    state: directory
    owner: root
    group: root
    mode: "0755"

# The admin PIN lives only on the device (never in git, since the repo is
# public). Created once with a default; change it in /etc/kiosk/admin.env and
# `sudo systemctl restart pitv-backend`. force:false keeps your value on re-runs.
- name: Create admin PIN env file (if absent)
  ansible.builtin.copy:
    dest: /etc/kiosk/admin.env
    content: "ADMIN_PIN=0000\n"
    owner: root
    group: root
    mode: "0600"
    force: false
  notify: Restart backend

# Optional YouTube Data API key for full-playlist support (without it, playlists
# fall back to the keyless RSS feed of ~15 recent videos). Lives only on the
# device (never in git). Paste your key into /etc/kiosk/youtube.env and restart.
- name: Create YouTube API key env file (if absent)
  ansible.builtin.copy:
    dest: /etc/kiosk/youtube.env
    content: "YOUTUBE_API_KEY=\n"
    owner: root
    group: root
    mode: "0600"
    force: false
  notify: Restart backend

- name: Deploy backend source
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../server/"
    dest: "{{ backend_root }}/"
    owner: "{{ backend_user }}"
    group: "{{ backend_user }}"
    mode: preserve
  notify: Restart backend

- name: Install backend dependencies
  ansible.builtin.command:
    cmd: /usr/bin/npm install --no-audit --no-fund
    chdir: "{{ backend_root }}"
  changed_when: false

- name: Build backend
  ansible.builtin.command:
    cmd: /usr/bin/npm run build
    chdir: "{{ backend_root }}"
  changed_when: false
  notify: Restart backend

- name: Fix backend ownership after install/build
  ansible.builtin.file:
    path: "{{ backend_root }}"
    state: directory
    owner: "{{ backend_user }}"
    group: "{{ backend_user }}"
    recurse: true

- name: Install backend systemd unit
  ansible.builtin.template:
    src: pitv-backend.service.j2
    dest: /etc/systemd/system/pitv-backend.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart backend

- name: Flush handlers before enabling the service
  ansible.builtin.meta: flush_handlers

- name: Enable and start backend
  ansible.builtin.systemd:
    name: pitv-backend.service
    enabled: true
    state: started
