---
# Install Node.js from NodeSource (distro Node on Bookworm is EOL).
- name: Ensure apt keyrings dir exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Add NodeSource signing key
  ansible.builtin.get_url:
    url: https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key
    dest: /etc/apt/keyrings/nodesource.asc
    mode: "0644"

- name: Add NodeSource apt repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/nodesource.asc] https://deb.nodesource.com/node_{{ nodejs_major }}.x nodistro main"
    filename: nodesource
    state: present

- name: Install Node.js and build toolchain (for native modules)
  ansible.builtin.apt:
    name:
      - nodejs
      - build-essential   # in case better-sqlite3 has no prebuilt binary
      - python3
    state: present
    update_cache: true
