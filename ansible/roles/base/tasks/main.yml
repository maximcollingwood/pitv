---
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install base packages
  ansible.builtin.apt:
    name:
      - git
      - ca-certificates
      - unattended-upgrades
      - python3
      - acl                # lets Ansible run database migrations as the service user
      - openssh-server
      - avahi-daemon
    state: present

- name: Enable and start SSH on boot
  ansible.builtin.systemd:
    name: ssh
    enabled: true
    state: started

- name: Advertise the phone companion on the local network
  ansible.builtin.systemd:
    name: avahi-daemon
    enabled: true
    state: started

- name: Enable unattended security upgrades
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    owner: root
    group: root
    mode: "0644"
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";

# Media imports write hundreds of MB. With the default ratios (10%/20% of RAM)
# the kernel buffers ~300 MB and then saturates the SD card for 10+ seconds,
# stalling every fsync on the device. Small limits keep writeback continuous.
- name: Bound dirty page cache for SD card writeback
  ansible.builtin.copy:
    dest: /etc/sysctl.d/90-pitv-writeback.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by Ansible.
      vm.dirty_background_bytes = 8388608
      vm.dirty_bytes = 33554432
  register: writeback_sysctl

- name: Apply writeback limits
  ansible.builtin.command: sysctl -p /etc/sysctl.d/90-pitv-writeback.conf
  when: writeback_sysctl.changed
