---
# Raspberry Pi OS and plain Debian are both "Debian" to ansible_facts, but they
# name the Chromium package differently. Detect via /etc/rpi-issue.
- name: Detect Raspberry Pi OS
  ansible.builtin.stat:
    path: /etc/rpi-issue
  register: rpi_issue

- name: Select Chromium package/binary name
  ansible.builtin.set_fact:
    chromium_package: "{{ 'chromium-browser' if rpi_issue.stat.exists else 'chromium' }}"
    chromium_binary: "{{ 'chromium-browser' if rpi_issue.stat.exists else 'chromium' }}"

- name: Install kiosk display stack
  ansible.builtin.apt:
    name:
      - labwc             # configurable wlroots compositor (Pi OS native)
      - xwayland          # let Chromium render via X (as it did under cage)
      - "{{ chromium_package }}"
    state: present

# Hide the mouse cursor system-wide by shipping a transparent Xcursor theme
# and pointing the session at it (XCURSOR_THEME=blank in the launch script).
# labwc + Xwayland both honor Xcursor lookup.
- name: Ensure blank Xcursor theme directory exists
  ansible.builtin.file:
    path: /usr/share/icons/blank/cursors
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install blank Xcursor theme index
  ansible.builtin.copy:
    dest: /usr/share/icons/blank/index.theme
    owner: root
    group: root
    mode: "0644"
    content: |
      [Icon Theme]
      Name=blank
      Comment=Fully transparent cursor for the kiosk

# Generate a minimal 1x1 fully-transparent Xcursor binary as the theme's
# "default" cursor. Compositors that can't find a named cursor fall back to
# "default", so this catches every cursor request.
- name: Generate the blank default cursor
  ansible.builtin.shell: |
    python3 - <<'PY'
    import struct
    header = struct.pack('<4sIII', b'Xcur', 16, 0x10000, 1)
    toc    = struct.pack('<III', 0xfffd0002, 1, 28)
    img    = struct.pack('<IIIIIIIII', 36, 0xfffd0002, 1, 1, 1, 1, 0, 0, 0)
    pixel  = b'\x00\x00\x00\x00'  # 1px BGRA, fully transparent
    with open('/usr/share/icons/blank/cursors/default', 'wb') as f:
        f.write(header + toc + img + pixel)
    PY
  args:
    creates: /usr/share/icons/blank/cursors/default

# Hardware video decode + tear-free presentation both require the full KMS
# driver (vc4-kms-v3d). Pi OS Bookworm ships with it enabled, but assert it
# from config so a flashed image with the legacy fkms overlay still gets
# corrected on the first ansible-pull. A reboot is required for it to take
# effect — the playbook only logs that, it doesn't reboot.
- name: Ensure full KMS graphics driver is enabled (Pi only)
  ansible.builtin.lineinfile:
    path: /boot/firmware/config.txt
    regexp: '^\s*dtoverlay=vc4-(f?kms)-v3d.*$'
    line: 'dtoverlay=vc4-kms-v3d'
    state: present
  when: rpi_issue.stat.exists
  register: kms_overlay

- name: Note that a reboot is needed if the KMS overlay was changed
  ansible.builtin.debug:
    msg: "vc4-kms-v3d overlay updated in /boot/firmware/config.txt — reboot the pi for video decode + tear-free scanout to take effect."
  when: rpi_issue.stat.exists and kms_overlay.changed

# Keep the HDMI connector (and therefore its ALSA audio device) present even
# when the TV is off for a long time. Under full KMS, a long TV-off can fully
# remove the DRM connector, taking the audio sink with it. Force-enabling the
# connector on the kernel cmdline keeps it — and its audio device — alive at
# all times, like a streaming stick that never "loses" the TV. The trailing
# ':e' forces the connector enabled while still letting the TV's EDID pick the
# mode when it's on, so we don't hardcode a resolution that could mismatch a TV.
# cmdline.txt is a single space-separated line, so we append the token with
# lineinfile (line-oriented, unlike replace, so it can't spill onto a phantom
# second line). The negative lookahead makes it idempotent; '.+' avoids matching
# an empty trailing line.
- name: Force HDMI connector always-enabled so its audio device never disappears (Pi only)
  ansible.builtin.lineinfile:
    path: /boot/firmware/cmdline.txt
    backrefs: true
    regexp: '^(?!.*\bvideo=HDMI-A-1:)(.+)$'
    line: '\1 video=HDMI-A-1:e'
  when: rpi_issue.stat.exists
  register: hdmi_cmdline

- name: Note that a reboot is needed if the HDMI connector force was added
  ansible.builtin.debug:
    msg: "video=HDMI-A-1:e added to /boot/firmware/cmdline.txt — reboot the pi so the HDMI connector (and its audio device) stays present across TV-off periods."
  when: rpi_issue.stat.exists and hdmi_cmdline.changed
