---
# PiTV runs a native Qt/libmpv television application and a web phone companion.
nodejs_major: 22
backend_user: pitv
workspace_root: /opt/pitv
backend_root: "{{ workspace_root }}/server"
app_root: "{{ workspace_root }}/app"
native_root: /opt/pitv-native
db_dir: /var/lib/pitv
db_path: "{{ db_dir }}/library.db"
backend_port: 3000

# The oldest yt-dlp the device accepts. Videos stream through it, so the device
# installs newer releases daily (media-tools role) as YouTube changes.
yt_dlp_version: "2026.08.19"
media_tools_root: /opt/pitv-media-tools
media_cache_limit_mb: 4096
media_max_asset_mb: 512
media_queue_limit: 200

kiosk_repo_url: "https://github.com/maximcollingwood/pitv.git"
kiosk_repo_branch: main
# The admin page can pull and re-apply this repo (update-kiosk). The development
# VM is provisioned from the shared folder instead.
kiosk_self_update: true
kiosk_user: kiosk
kiosk_uid: 1001
kiosk_groups: [video, render, input, tty, audio]
admin_console_tty: 2
# The development VM compiles/tests the native app without a physical HDMI seat.
kiosk_start_compositor: true
# Display server for the TV app: labwc (Pi) or xorg (development VM window).
kiosk_display: labwc
# Development only: load the TV app's QML from this directory instead of the
# compiled-in copy, so QML edits need an app restart rather than a rebuild.
kiosk_qml_dir: ""
# HDMI colour range (automatic, full or limited) the screen session applies as it
# starts. The admin page's System tab changes it on the device; this is only the
# first value, and re-provisioning keeps the device's choice.
hdmi_range_file: /etc/kiosk/hdmi-range
kiosk_hdmi_range: automatic
native_build_jobs: 2
