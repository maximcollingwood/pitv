---
# ──────────────────────────────────────────────────────────────────────────
# The two things you'll change most often:
# ──────────────────────────────────────────────────────────────────────────

# The web app the kiosk displays. Remote URL, LAN address, or http://localhost
# if you self-host the app on the pi.
# Default points at the bundled placeholder page (see kiosk_serve_local_app).
kiosk_url: "http://localhost"

# When true, this device hosts the full app stack locally (frontend + API +
# SQLite) and kiosk_url should point at http://localhost. Set false to point
# the kiosk at a remote URL instead.
kiosk_serve_local_app: true

# ──────────────────────────────────────────────────────────────────────────
# App stack (frontend + backend + database)
# ──────────────────────────────────────────────────────────────────────────
nodejs_major: 22
backend_user: "pitv"
backend_root: "/opt/pitv-backend"   # Fastify API source + build
app_root: "/opt/pitv-frontend"      # React source; built into {{ app_root }}/dist
db_dir: "/var/lib/pitv"
db_path: "{{ db_dir }}/library.db"
backend_port: 3000
db_schema_version: 2     # bump to force a one-time DB reset on the next deploy

# Where this config lives, used by the `update-kiosk` helper (ansible-pull).
# Set this to your GitHub repo before flashing the pi.
kiosk_repo_url: "https://github.com/maximcollingwood/pitv.git"
kiosk_repo_branch: "main"

# ──────────────────────────────────────────────────────────────────────────
# Kiosk identity
# ──────────────────────────────────────────────────────────────────────────
kiosk_user: "kiosk"
kiosk_uid: 1001                       # fixed so XDG_RUNTIME_DIR is deterministic
kiosk_groups:                         # seat/DRM/input access for the compositor
  - video
  - render
  - input
  - tty
kiosk_data_dir: "/home/{{ kiosk_user }}/.kiosk-profile"  # disposable Chromium state

# Escape-hatch console: Ctrl+Alt+F<this> reaches a login shell; Ctrl+Alt+F1
# returns to the kiosk. A getty is kept running here permanently.
admin_console_tty: 2

# When false, the playbook installs everything but does NOT start the on-screen
# compositor. The dev VM sets this false (VirtualBox has no real DRM/GPU seat),
# so `vagrant provision` validates the whole playbook without needing a GPU.
# The pi leaves this true.
kiosk_start_compositor: true

# ──────────────────────────────────────────────────────────────────────────
# Chromium hardening flags. Edit freely; rendered into the launch script.
# ──────────────────────────────────────────────────────────────────────────
chromium_flags:
  - "--kiosk"
  - "--noerrdialogs"
  - "--disable-infobars"
  - "--incognito"
  - "--disable-session-crashed-bubble"
  - "--disable-features=Translate"
  - "--no-first-run"
  - "--fast"
  - "--fast-start"
  - "--check-for-update-interval=31536000"
  - "--autoplay-policy=no-user-gesture-required"   # let videos auto-start with sound
