---
- name: Provision Raspberry Pi web kiosk
  hosts: all
  become: true
  roles:
    - base
    # Local app stack (frontend + API + DB). Toggle with kiosk_serve_local_app.
    - role: nodejs
      when: kiosk_serve_local_app
    - role: database
      when: kiosk_serve_local_app
    - role: backend
      when: kiosk_serve_local_app
    - role: app
      when: kiosk_serve_local_app
    # Kiosk display layer.
    - kiosk-user
    - display
    - audio
    - kiosk-service
